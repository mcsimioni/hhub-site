version: "3.7"

services:
  hhub-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hhub_site
    restart: unless-stopped
    networks:
      - portainer-traevik_default
    labels:
      - "traefik.enable=true"
      # Aceita tanto hhub.dev quanto www.hhub.dev
      - "traefik.http.routers.hhub.rule=Host(`hhub.dev`) || Host(`www.hhub.dev`)"
      - "traefik.http.routers.hhub.entrypoints=websecure"
      - "traefik.http.routers.hhub.tls=true"
      # Porta interna do Nginx (80)
      - "traefik.http.services.hhub.loadbalancer.server.port=80"

networks:
  portainer-traevik_default:
    external: true
